<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabore In Casa — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Nunito',sans-serif; background:#0f0f0f; color:#fff; min-height:100vh; }

/* =============================================
   TELA DE LOGIN
============================================= */

#telaLogin {
    position:fixed; inset:0;
    background:linear-gradient(135deg, #0f0f0f, #1a1a1a);
    display:flex; justify-content:center; align-items:center;
    z-index:99999; padding:20px;
}

.login-box {
    background:#1f1f1f;
    border-radius:22px;
    padding:36px 28px;
    width:100%;
    max-width:380px;
    text-align:center;
    border:1px solid #333;
    box-shadow:0 20px 60px rgba(0,0,0,0.8);
    animation:aparecer 0.3s ease;
}

@keyframes aparecer {
    from{ transform:scale(0.9); opacity:0; }
    to  { transform:scale(1);   opacity:1; }
}

.login-logo {
    font-size:48px;
    margin-bottom:8px;
}

.login-box h2 {
    font-family:'Montserrat',sans-serif;
    font-size:22px;
    margin-bottom:4px;
    color:#ff9800;
}

.login-box p {
    font-size:14px;
    color:#888;
    margin-bottom:28px;
}

.login-input {
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    border:2px solid #444;
    background:#2a2a2a;
    color:#fff;
    font-size:17px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    outline:none;
    text-align:center;
    letter-spacing:3px;
    margin-bottom:14px;
    transition:border-color 0.2s, box-shadow 0.2s;
}
.login-input:focus {
    border-color:#ff9800;
    box-shadow:0 0 0 3px rgba(255,152,0,0.2);
}
.login-input::placeholder {
    letter-spacing:0;
    color:#555;
    font-weight:500;
}

.btn-entrar {
    width:100%;
    background:linear-gradient(135deg,#ff6600,#ff9800);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:14px;
    font-weight:900;
    font-size:17px;
    font-family:'Montserrat',sans-serif;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(255,152,0,0.4);
    transition:transform 0.2s;
}
.btn-entrar:hover { transform:scale(1.03); }
.btn-entrar:active { transform:scale(0.97); }

.login-erro {
    color:#fca5a5;
    font-size:14px;
    font-weight:700;
    margin-top:12px;
    min-height:20px;
    display:none;
}

.tentativas-aviso {
    color:#888;
    font-size:13px;
    margin-top:10px;
}

/* =============================================
   PAINEL ADMIN
============================================= */

#painelAdmin { display:none; }

.admin-header{
    background:linear-gradient(135deg,#ff6600,#ff9800);
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.admin-header h1{ font-family:'Montserrat',sans-serif; font-size:20px; color:#000; }
.admin-header-btns { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.admin-header a {
    color:#000; font-weight:700; font-size:14px; text-decoration:none;
    background:rgba(0,0,0,0.15); padding:8px 14px; border-radius:8px;
}
.btn-sair {
    background:rgba(0,0,0,0.25); color:#000; border:none;
    padding:8px 14px; border-radius:8px; font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Nunito',sans-serif;
}
.btn-sair:hover { background:rgba(0,0,0,0.35); }

.admin-body{ padding:20px; max-width:1000px; margin:auto; }

.stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card{ background:#1f1f1f; border-radius:14px; padding:18px; text-align:center; border:1px solid #333; }
.stat-num{ font-size:32px; font-weight:900; color:#ff9800; display:block; }
.stat-label{ font-size:13px; color:#888; margin-top:4px; }

.section{ background:#1f1f1f; border-radius:14px; padding:20px; margin-bottom:20px; border:1px solid #333; }
.section h2{ font-family:'Montserrat',sans-serif; font-size:18px; margin-bottom:16px; color:#ff9800; }

.aniv-card{
    background:#1a2e1a; border:1px solid #2ecc7155; border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.aniv-info b{ font-size:16px; display:block; margin-bottom:2px; }
.aniv-info span{ font-size:13px; color:#888; }
.aniv-badge{ background:#2ecc71; color:#000; border-radius:20px; padding:4px 12px; font-weight:800; font-size:13px; }
.aniv-hoje{ background:#ffd700; color:#000; }
.btn-wpp{
    background:#25D366; color:#fff; border:none; padding:10px 16px;
    border-radius:10px; font-weight:800; font-size:14px; cursor:pointer;
    font-family:'Nunito',sans-serif;
}
.btn-wpp:hover{ background:#1ebe5d; }

.cliente-table{ width:100%; border-collapse:collapse; font-size:14px; }
.cliente-table th{
    background:#2a2a2a; padding:12px 14px; text-align:left;
    font-size:13px; color:#aaa; font-weight:700; border-bottom:2px solid #333;
}
.cliente-table td{ padding:12px 14px; border-bottom:1px solid #2a2a2a; vertical-align:top; }
.cliente-table tr:hover td{ background:#252525; }

.btn-exportar{
    background:#ff9800; color:#fff; border:none; padding:13px 24px;
    border-radius:12px; font-weight:800; font-size:15px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Nunito',sans-serif; margin-bottom:6px;
}
.btn-exportar:hover{ background:#e68900; transform:scale(1.03); }

.btn-limpar{
    background:transparent; color:#e53935; border:2px solid #e53935;
    padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px;
    cursor:pointer; margin-left:10px; font-family:'Nunito',sans-serif;
}

.vazio{ color:#666; font-size:15px; text-align:center; padding:30px; }

.search-admin{
    width:100%; padding:12px 16px; border-radius:10px; border:2px solid #444;
    background:#2a2a2a; color:#fff; font-size:15px; font-family:'Nunito',sans-serif;
    outline:none; margin-bottom:16px;
}
.search-admin:focus{ border-color:#ff9800; }

.aniv-destaque {
    background:#2e2a00;
    border:1px solid #ffd70055;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}

@media(max-width:600px){
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
    .cliente-table th:nth-child(3),
    .cliente-table td:nth-child(3){ display:none; }
    .admin-header h1 { font-size:16px; }
}
</style>
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="telaLogin">
  <div class="login-box">
    <div class="login-logo">🍕</div>
    <h2>Sabore In Casa</h2>
    <p>Painel Administrativo — Acesso Restrito</p>

    <input
      class="login-input"
      id="inputSenha"
      type="password"
      placeholder="Digite a senha"
      onkeydown="if(event.key==='Enter') tentarEntrar()"
      autocomplete="off"
    >

    <button class="btn-entrar" onclick="tentarEntrar()">Entrar</button>

    <div class="login-erro" id="loginErro">Senha incorreta. Tente novamente.</div>
    <div class="tentativas-aviso" id="tentativasAviso"></div>
  </div>
</div>

<!-- ===================== PAINEL ADMIN ===================== -->
<div id="painelAdmin">

  <div class="admin-header">
    <h1>Painel Admin — Sabore In Casa</h1>
    <div class="admin-header-btns">
      <a href="index.html">Voltar ao App</a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- ANIVERSARIANTES -->
    <div class="section">
      <h2>🎂 Aniversariantes Proximos (2 dias)</h2>
      <div id="aniversariantes"></div>
    </div>

    <!-- CLIENTES -->
    <div class="section">
      <h2>👥 Clientes Cadastrados</h2>
      <button class="btn-exportar" onclick="exportarCSV()">📥 Exportar Planilha (.csv)</button>
      <button class="btn-limpar" onclick="confirmarLimpar()">🗑️ Limpar tudo</button>
      <br><br>
      <input class="search-admin" id="buscaAdmin" placeholder="Buscar por nome ou WhatsApp..." oninput="renderTabela()">
      <div id="tabelaClientes"></div>
    </div>

  </div>
</div>

<script>
// =============================================
// SENHA E LOGIN
// =============================================

const SENHA_CORRETA = "459fyg59"
let tentativas = 0
const MAX_TENTATIVAS = 5

// Verifica se ja esta logado na sessao
if(sessionStorage.getItem("adminLogado") === "sim"){
    document.getElementById("telaLogin").style.display = "none"
    document.getElementById("painelAdmin").style.display = "block"
    renderAll()
}

function tentarEntrar(){
    const senha = document.getElementById("inputSenha").value

    if(tentativas >= MAX_TENTATIVAS){
        document.getElementById("loginErro").innerText = "Muitas tentativas. Recarregue a pagina."
        document.getElementById("loginErro").style.display = "block"
        document.getElementById("inputSenha").disabled = true
        return
    }

    if(senha === SENHA_CORRETA){
        sessionStorage.setItem("adminLogado", "sim")
        document.getElementById("telaLogin").style.display = "none"
        document.getElementById("painelAdmin").style.display = "block"
        renderAll()
    } else {
        tentativas++
        const restantes = MAX_TENTATIVAS - tentativas
        const erroEl = document.getElementById("loginErro")
        erroEl.innerText = "Senha incorreta. Tente novamente."
        erroEl.style.display = "block"

        if(restantes > 0){
            document.getElementById("tentativasAviso").innerText = `${restantes} tentativa(s) restante(s)`
        } else {
            erroEl.innerText = "Muitas tentativas incorretas. Recarregue a pagina."
            document.getElementById("inputSenha").disabled = true
        }

        // Limpa o campo
        document.getElementById("inputSenha").value = ""
        document.getElementById("inputSenha").focus()

        // Shake animation
        const box = document.querySelector(".login-box")
        box.style.transform = "translateX(-8px)"
        setTimeout(()=>{ box.style.transform = "translateX(8px)" }, 100)
        setTimeout(()=>{ box.style.transform = "translateX(0)" }, 200)
    }
}

function sair(){
    sessionStorage.removeItem("adminLogado")
    document.getElementById("painelAdmin").style.display = "none"
    document.getElementById("telaLogin").style.display = "flex"
    document.getElementById("inputSenha").value = ""
    document.getElementById("loginErro").style.display = "none"
    document.getElementById("tentativasAviso").innerText = ""
    tentativas = 0
}

// =============================================
// DADOS
// =============================================

function getClientes(){
    return JSON.parse(localStorage.getItem("bancoclientes") || "[]")
}

function diasParaAniversario(anivStr){
    if(!anivStr) return null
    const hoje = new Date()
    const parts = anivStr.split("-")
    let mes, dia
    if(parts.length === 3){ mes = Number(parts[1]); dia = Number(parts[2]) }
    else { mes = Number(parts[0]); dia = Number(parts[1]) }
    if(isNaN(mes)||isNaN(dia)) return null
    const anivEsteAno = new Date(hoje.getFullYear(), mes-1, dia)
    const diff = Math.ceil((anivEsteAno - hoje) / (1000*60*60*24))
    return diff
}

function formatarData(str){
    if(!str) return "-"
    try{ return new Date(str).toLocaleDateString("pt-BR") }
    catch(e){ return str }
}

// =============================================
// RENDER
// =============================================

function renderStats(){
    const lista = getClientes()
    let anivHoje = 0
    lista.forEach(c=>{
        const d = diasParaAniversario(c.aniversario)
        if(d === 0) anivHoje++
    })
    document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><span class="stat-num">${lista.length}</span><span class="stat-label">Clientes cadastrados</span></div>
    <div class="stat-card"><span class="stat-num">${lista.filter(c=>c.aniversario).length}</span><span class="stat-label">Com aniversario</span></div>
    <div class="stat-card"><span class="stat-num">${anivHoje}</span><span class="stat-label">Aniversario hoje</span></div>
    <div class="stat-card"><span class="stat-num">${lista.filter(c=>c.whatsapp).length}</span><span class="stat-label">Com WhatsApp</span></div>`
}

function renderAniversariantes(){
    const lista = getClientes()
    const proximos = []
    lista.forEach(c=>{
        const d = diasParaAniversario(c.aniversario)
        if(d !== null && d >= 0 && d <= 2) proximos.push({...c, diasRestantes:d})
    })
    proximos.sort((a,b)=>a.diasRestantes-b.diasRestantes)

    const el = document.getElementById("aniversariantes")
    if(proximos.length === 0){
        el.innerHTML = `<div class="vazio">Nenhum aniversariante nos proximos 2 dias</div>`
        return
    }

    el.innerHTML = proximos.map(c=>{
        const badge = c.diasRestantes === 0
            ? `<span class="aniv-badge aniv-hoje">🎉 HOJE!</span>`
            : `<span class="aniv-badge">${c.diasRestantes} dia(s)</span>`

        const msg = encodeURIComponent(
            `Oi ${c.nome.split(" ")[0]}! Feliz Aniversario! 🎂🎉\n\n` +
            `O Sabore In Casa tem um presente especial para voce!\n\n` +
            `Use o cupom *SABOREANIV* e ganhe *10% de desconto* no seu pedido hoje!\n\n` +
            `Acesse agora: https://saboreincasa.github.io/app-delivery-sabore-in-casa/\n\n` +
            `Com carinho, equipe Sabore In Casa 🍕`
        )

        const cardClass = c.diasRestantes === 0 ? "aniv-destaque" : "aniv-card"

        const wppBtn = c.whatsapp
            ? `<button class="btn-wpp" onclick="window.open('https://wa.me/55${c.whatsapp}?text=${msg}')">📲 Enviar mensagem</button>`
            : `<span style="color:#666;font-size:13px">Sem WhatsApp</span>`

        return `
        <div class="${cardClass}">
            <div class="aniv-info">
                <b>${c.nome}</b>
                <span>📱 ${c.whatsapp || "Sem WhatsApp"} &nbsp;|&nbsp; ${c.diasRestantes === 0 ? "🎂 Aniversario HOJE!" : `${c.diasRestantes} dia(s) para o aniversario`}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                ${badge}
                ${wppBtn}
            </div>
        </div>`
    }).join("")
}

function renderTabela(){
    const lista = getClientes()
    const busca = document.getElementById("buscaAdmin")?.value?.toLowerCase() || ""
    const filtrado = lista.filter(c=>
        (c.nome||"").toLowerCase().includes(busca) ||
        (c.whatsapp||"").includes(busca)
    ).reverse() // mais recentes primeiro

    const el = document.getElementById("tabelaClientes")
    if(filtrado.length === 0){
        el.innerHTML = `<div class="vazio">${lista.length === 0 ? "Nenhum cliente cadastrado ainda" : "Nenhum cliente encontrado"}</div>`
        return
    }

    el.innerHTML = `
    <table class="cliente-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>WhatsApp</th>
                <th>Aniversario</th>
                <th>Cadastro</th>
                <th>Acao</th>
            </tr>
        </thead>
        <tbody>
            ${filtrado.map(c=>{
                const dias = diasParaAniversario(c.aniversario)
                const anivTexto = c.aniversario
                    ? (dias === 0 ? `${formatarData(c.aniversario)} 🎂 HOJE!`
                    : dias !== null && dias <= 2 ? `${formatarData(c.aniversario)} (${dias} dia(s))`
                    : formatarData(c.aniversario))
                    : "-"
                const anivStyle = dias !== null && dias <= 2 ? "color:#ffd700;font-weight:800" : ""

                const msgPadrao = encodeURIComponent(
                    `Oi ${c.nome.split(" ")[0]}! Tudo bem?\n\n` +
                    `Sentimos sua falta no Sabore In Casa! 🍕\n\n` +
                    `Temos novidades e combos incriveis esperando por voce!\n\n` +
                    `Acesse: https://saboreincasa.github.io/app-delivery-sabore-in-casa/`
                )

                return `<tr>
                    <td><b>${c.nome}</b></td>
                    <td>${c.whatsapp || "-"}</td>
                    <td style="${anivStyle}">${anivTexto}</td>
                    <td>${formatarData(c.dataCadastro || c.cadastrado)}</td>
                    <td>${c.whatsapp
                        ? `<button class="btn-wpp" style="padding:7px 12px;font-size:13px" onclick="window.open('https://wa.me/55${c.whatsapp}?text=${msgPadrao}')">📲 Msg</button>`
                        : "-"}</td>
                </tr>`
            }).join("")}
        </tbody>
    </table>`
}

function exportarCSV(){
    const lista = getClientes()
    if(lista.length === 0){ alert("Nenhum cliente para exportar!"); return }

    const cabecalho = ["Nome","WhatsApp","Aniversario","Data de Cadastro"]
    const linhas = lista.map(c=>[
        `"${(c.nome||"").replace(/"/g,'""')}"`,
        `"${c.whatsapp||""}"`,
        `"${c.aniversario ? new Date(c.aniversario+"T00:00:00").toLocaleDateString("pt-BR") : ""}"`,
        `"${c.dataCadastro ? new Date(c.dataCadastro).toLocaleDateString("pt-BR") : ""}"`
    ].join(","))

    const csv = [cabecalho.join(","), ...linhas].join("\n")
    const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"})
    const url  = URL.createObjectURL(blob)
    const a    = document.createElement("a")
    a.href     = url
    a.download = `clientes_sabore_${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.csv`
    a.click()
    URL.revokeObjectURL(url)
}

function confirmarLimpar(){
    if(confirm("Tem certeza que deseja apagar TODOS os clientes? Esta acao nao pode ser desfeita!")){
        localStorage.removeItem("bancoclientes")
        renderAll()
        alert("Todos os clientes foram removidos.")
    }
}

function renderAll(){
    renderStats()
    renderAniversariantes()
    renderTabela()
}

// Atualiza a cada 30 segundos
setInterval(()=>{
    if(sessionStorage.getItem("adminLogado") === "sim") renderAll()
}, 30000)
</script>

</body>
</html>
